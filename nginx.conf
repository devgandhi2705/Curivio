server {
    listen 7860;
    server_name _;

    # Serve React build from dist/
    root /app/frontend/dist;
    index index.html;

    # ── Feed v2 multi-agent SSE stream (Phase 7) ───────────────────────────────
    # A real run is 3-4 minutes (mentor-deck target). Events stream per node
    # transition, but a single slow agent leg can exceed the 120s /api/ read timeout,
    # so this route gets its own generous window. Buffering stays off so each node
    # event reaches the client immediately (the app also sends X-Accel-Buffering:no).
    # Regex location -> takes precedence over the /api/ prefix for this exact path.
    location ~ ^/api/(v2/projects/[^/]+/generate/stream)$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # ── API proxy → Python backend ─────────────────────────────────────────────
    # All /api/* requests are stripped of the /api prefix and forwarded to uvicorn.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for NDJSON streaming (chat, deep research progress)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Allow long-running requests (deep research can take 30+ seconds)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Health check passthrough ───────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # ── Static assets (Vite build output) ─────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA routing — serve index.html for all unknown paths ──────────────────
    # This handles client-side routes: /chat, /feed, /bookmarks, /settings, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
