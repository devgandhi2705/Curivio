<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EFEDDC" />
    <!-- Colour mode, before first paint. Anything that waits for React runs one
         frame too late and the wrong palette flashes on every reload. -->
    <script>
      (function () {
        var m = 'light'
        try { var s = localStorage.getItem('curivio.ui'); if (s === 'dark' || s === 'legacy' || s === 'light') m = s } catch (e) {}
        document.documentElement.setAttribute('data-ui', m)
        var t = document.querySelector('meta[name="theme-color"]')
        if (t) t.setAttribute('content', { light: '#EFEDDC', dark: '#211D17', legacy: '#0f1117' }[m])
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Learn smarter, a few minutes every day. Curivio delivers curated insights, news, and deep dives tailored to your interests." />
    <title>Curivio — Learn Smarter Every Day</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
